<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BookHub — Ranking de Leitores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ranking/css/ranking.css">
  <link rel="stylesheet" href="/css/bookhub-theme.css">
  <script src="/js/bookhub-theme.js"></script>
</head>
<body>
  <canvas id="interactiveCanvas"></canvas>

  <header class="netflix-header">
    <div class="header-left">
      <a href="/" class="netflix-logo" aria-label="BookHub — página inicial">
        <img src="/assets/bookhub-heroes-logo-transparent.png" alt="BookHub — Heróis Literários em Ação">
      </a>
      <nav class="netflix-nav">
        <a href="/ranking/html/ranking.html" class="ativo">Ranking de Leitores</a>
      </nav>
    </div>
    <div class="header-right">
      <a href="/" class="btn-voltar-vitrine">Voltar à Vitrine</a>
    </div>
  </header>

  <main class="ranking-container">
    <div class="ranking-header-title">
      <h1>🏆 Hall da Fama — Maiores Leitores</h1>
      <p>Ganhe pontos com suas atividades no BookHub e conquiste um lugar no pódio da temporada.</p>
    </div>

    <div class="ranking-season-toolbar">
      <label for="seasonSelector">Temporada</label>
      <select id="seasonSelector" aria-label="Selecionar temporada do ranking"></select>
      <span id="seasonStatusText" role="status"></span>
    </div>

    <div class="podium-section" id="podiumSection"></div>

    <div class="ranking-table-card">
      <h3 id="rankingTitle">Classificação da Temporada</h3>
      <table class="ranking-table">
        <thead>
          <tr>
            <th style="width: 80px;">Posição</th>
            <th>Leitor / Usuário</th>
            <th>Pontos</th>
            <th>Reconhecimento</th>
          </tr>
        </thead>
        <tbody id="rankingTableBody"></tbody>
      </table>
    </div>

    <p class="ranking-proof" id="rankingProof" hidden></p>
  </main>

  <script src="/ranking/js/ranking.js"></script>
</body>
</html>
