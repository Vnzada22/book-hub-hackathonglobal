<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complete seu perfil — BookHub</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,Arial,sans-serif;background:#edf2f9;color:#14263e;display:grid;place-items:center;padding:20px}.panel{width:min(100%,500px);background:#fff;border:1px solid #c9d6e6;border-radius:22px;padding:30px;box-shadow:0 16px 48px #14345120}h1{font-size:1.6rem;margin:0 0 10px}.help{color:#54667f;line-height:1.5}label{display:block;margin:17px 0 6px;font-weight:650}input{display:block;width:100%;padding:13px;border:1px solid #b4c2d5;border-radius:9px;background:#fff;color:#102037;font-size:1rem}input:focus{outline:3px solid #8eb8ed}button{border:0;border-radius:10px;padding:13px 15px;font-size:1rem;font-weight:700;cursor:pointer;background:#164b85;color:#fff}button:disabled{opacity:.55;cursor:wait}.row{display:flex;gap:10px;align-items:center}.row input{flex:1;min-width:0}.row button{white-space:nowrap}.submit{width:100%;margin-top:22px}.msg{min-height:24px;color:#ad2525;margin-top:14px}.fine{font-size:.85rem;color:#5b687b}@media(prefers-color-scheme:dark){body{background:#101a2b;color:#f2f6ff}.panel{background:#1c293e;border-color:#465773}.help,.fine{color:#b9c9df}input{background:#142135;color:#fff;border-color:#586d87}}
</style></head><body><main class="panel"><h1>Vamos configurar seu perfil</h1><p class="help">Escolha como você será conhecido no BookHub. O username e o e-mail ficam fixos após a confirmação.</p><form id="form"><label for="nome">Seu nome</label><input id="nome" required minlength="2" maxlength="100" autocomplete="name"><label for="username">Username definitivo</label><input id="username" required minlength="3" maxlength="24" pattern="[a-zA-Z0-9_]{3,24}" autocapitalize="none" autocomplete="off" placeholder="ex.: leitor_2026"><p class="fine">3–24 caracteres. Letras, números e underline. Não poderá ser alterado.</p><label for="email">E-mail para confirmar</label><div class="row"><input type="email" id="email" required autocomplete="email"><button type="button" id="send">Enviar código</button></div><label for="code">Código recebido por e-mail (se solicitado)</label><input id="code" inputmode="numeric" maxlength="6" placeholder="6 dígitos"><p class="fine">Se este e-mail já estiver verificado na sua conta, nenhum código adicional será necessário.</p><button class="submit" type="submit">Confirmar perfil</button><p id="msg" class="msg" role="status" aria-live="polite"></p></form></main><script src="/perfil/js/completar.js?v=20261103-onboarding-session"></script></body></html>
